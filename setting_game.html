<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="css/setting_game.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="js/setting_game.js"></script>
   
</head>
<body>
    <div id="image">
        <img id="background" src="assets/backgrounds/setting_background.png">
    </div>
    <img class="rhythme" src="assets/characters/rhythme0.png">
    <img class="shadow" src="assets/shadow/shadow1.png">
    <img class='wearing_hat' src="assets/clothes/pink_hat1.png">
    <img class='wearing_clothes' src="assets/clothes/pink_clothes1.png">
    <img class='difficulty_stage' src="assets/backgrounds/evening_background3.png">

    <div id="button_group">
        <button id="lower_arrow">
            <img class='arrow_img' src="assets/buttons/left_arrow_btn1.png">
        </button> 
        <button id="difficulty">
            <img class='button_img' src="assets/buttons/easy_btn.png">
        </button> 
        <button id="raise_arrow">
            <img class='arrow_img' src="assets/buttons/right_arrow_btn1.png">
        </button> 
        <button id="start">
            <img class='button_img' src="assets/buttons/start_btn1.png">
        </button>
        <button id="characters">
            <img class='button_img' src="assets/buttons/characters_btn3.png">
        </button>
        <button id="tutorial">  
            <img class='button_img' src="assets/buttons/tutorial_btn1.png">
        </button>     	
        <button id="back">  
            <img class='back_img' src="assets/buttons/back_btn2.png">
        </button>       
    </div>
</body>
</html>
